<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09132f"/>
      <stop offset="0.52" stop-color="#241348"/>
      <stop offset="1" stop-color="#0b0d2d"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#b9cfff" stop-opacity=".34"/>
      <stop offset="1" stop-color="#b9cfff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5e327c"/>
      <stop offset="1" stop-color="#11122e"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <filter id="shine" x="-200%" y="-200%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <pattern id="stars" width="96" height="86" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="16" r="1.1" fill="#fff7df" opacity=".65"/>
      <circle cx="68" cy="54" r="1.5" fill="#c7d9ff" opacity=".75"/>
      <circle cx="89" cy="8" r=".8" fill="#fff" opacity=".48"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#stars)" opacity=".72"/>
  <circle cx="860" cy="300" r="360" fill="url(#glow)"/>

  <g stroke-linecap="round" fill="none">
